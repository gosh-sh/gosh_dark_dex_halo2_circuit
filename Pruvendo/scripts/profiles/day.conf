# Day Profile Configuration
# Quick tests for CI/CD and development
# Expected runtime: ~5-15 minutes

# ============================================================
# FUZZING
# ============================================================
FUZZ_TIME_PER_TARGET=30      # seconds per fuzz target
FUZZ_RUNS=1000               # max runs per target (0 = unlimited)
FUZZ_MAX_TOTAL_TIME=30       # total time per target in seconds

# ============================================================
# PROPERTY TESTS
# ============================================================
PROPTEST_CASES=50            # number of test cases
PROPTEST_TIMEOUT=300000      # timeout in milliseconds (5 min)

# ============================================================
# APALACHE (Bounded Model Checking)
# ============================================================
APALACHE_MAX_STEPS=5         # max steps for BMC
APALACHE_MAX_ERROR=1         # stop after first error

# ============================================================
# QUINT RANDOM SIMULATION
# ============================================================
QUINT_MAX_SAMPLES=100        # number of random traces
QUINT_MAX_STEPS=10           # steps per trace

# ============================================================
# REAL PROVER TESTS
# ============================================================
REAL_PROVER_FILTER="test_real_prover_basic"  # Run only basic test
REAL_PROVER_SKIP_SLOW=true                    # Skip slow tests

