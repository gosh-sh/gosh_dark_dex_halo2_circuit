# Night Profile Configuration
# Full deep testing for overnight runs
# Expected runtime: ~4-8 hours

# ============================================================
# FUZZING
# ============================================================
FUZZ_TIME_PER_TARGET=1800    # seconds per fuzz target (30 min)
FUZZ_RUNS=0                  # unlimited runs
FUZZ_MAX_TOTAL_TIME=1800     # total time per target in seconds

# ============================================================
# PROPERTY TESTS
# ============================================================
PROPTEST_CASES=500           # number of test cases
PROPTEST_TIMEOUT=1800000     # timeout in milliseconds (30 min)

# ============================================================
# APALACHE (Bounded Model Checking)
# ============================================================
APALACHE_MAX_STEPS=25        # max steps for BMC (increased for deeper coverage)
APALACHE_MAX_ERROR=10        # collect up to 10 errors

# ============================================================
# QUINT RANDOM SIMULATION
# ============================================================
QUINT_MAX_SAMPLES=5000       # number of random traces
QUINT_MAX_STEPS=30           # steps per trace

# ============================================================
# REAL PROVER TESTS
# ============================================================
REAL_PROVER_FILTER="real_prover"  # Run all real_prover tests
REAL_PROVER_SKIP_SLOW=false       # Include slow tests

