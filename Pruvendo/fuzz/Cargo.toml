[package]
name = "gosh_dark_dex_halo2_circuit-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }

# Основной проект (уже содержит все нужные зависимости)
# Путь через симлинк fuzz -> Pruvendo/fuzz: fuzz/.. = корень проекта
# Cargo использует логический путь (через симлинк), не физический
gosh_dark_dex_halo2_circuit = { path = ".." }

# Используем те же версии что и основной проект
halo2_proofs = { git = "https://github.com/scroll-tech/halo2.git", branch = "v1.1" }
halo2-base = { git = "https://github.com/scroll-tech/halo2-lib", branch = "develop", default-features = false, features = ["halo2-pse", "display"] }

# Для импортов halo2curves
halo2curves = { git = "https://github.com/scroll-tech/halo2curves", branch = "v0.1.0" }

# Патчи из основного проекта
[patch.crates-io]
halo2curves = { git = "https://github.com/scroll-tech/halo2curves", branch = "v0.1.0" }

[patch."https://github.com/privacy-scaling-explorations/halo2.git"]
halo2_proofs = { git = "https://github.com/scroll-tech/halo2.git", branch = "v1.1" }

[patch."https://github.com/privacy-scaling-explorations/bls12_381"]
bls12_381 = { git = "https://github.com/scroll-tech/bls12_381", branch = "feat/impl_scalar_field" }

[[bin]]
name = "fuzz_soundness"
path = "fuzz_targets/fuzz_soundness.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_completeness"
path = "fuzz_targets/fuzz_completeness.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_determinism"
path = "fuzz_targets/fuzz_determinism.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_verifier_bytes"
path = "fuzz_targets/fuzz_verifier_bytes.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_token_binding"
path = "fuzz_targets/fuzz_token_binding.rs"
test = false
doc = false
